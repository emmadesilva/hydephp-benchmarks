<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 298" width="720" height="298" role="img" aria-label="All cores versus one core, 10,000 posts"><style>svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --context: #b9b8b0; }
@media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
          --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --context: #5c5b56; }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); font-size: 13px; }
.title { fill: var(--ink); font-size: 16px; font-weight: 600; }
.subtitle { fill: var(--ink-2); font-size: 13px; }
.label { fill: var(--ink); }
.value { fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.series-1 { fill: var(--series-1); stroke: var(--series-1); }
.series-2 { fill: var(--series-2); stroke: var(--series-2); }
.series-3 { fill: var(--series-3); stroke: var(--series-3); }
.context { fill: var(--context); stroke: var(--context); }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ring { stroke: var(--surface); stroke-width: 2; }
.break { stroke: var(--surface); stroke-width: 4; }</style><rect width="720" height="298" rx="8" style="fill: var(--surface)"/><text class="title" x="20" y="28">All cores versus one core, 10,000 posts</text><text class="subtitle" x="20" y="47">Median build time. The further apart the dots, the more a generator gains from extra cores.</text><circle class="series-1" cx="25" cy="64" r="5"/><text class="label" x="38" y="64" dominant-baseline="central">All 4 cores</text><circle class="series-2" cx="146" cy="64" r="5"/><text class="label" x="159" y="64" dominant-baseline="central">Pinned to 1 core</text><line class="grid" x1="190.0" x2="190.0" y1="78" y2="264"/><text class="tick" x="190.0" y="282" text-anchor="middle">0</text><line class="grid" x1="268.0" x2="268.0" y1="78" y2="264"/><text class="tick" x="268.0" y="282" text-anchor="middle">20</text><line class="grid" x1="346.0" x2="346.0" y1="78" y2="264"/><text class="tick" x="346.0" y="282" text-anchor="middle">40</text><line class="grid" x1="424.0" x2="424.0" y1="78" y2="264"/><text class="tick" x="424.0" y="282" text-anchor="middle">60</text><line class="grid" x1="502.0" x2="502.0" y1="78" y2="264"/><text class="tick" x="502.0" y="282" text-anchor="middle">80</text><line class="grid" x1="580.0" x2="580.0" y1="78" y2="264"/><text class="tick" x="580.0" y="282" text-anchor="middle">100 s</text><text class="label" x="180" y="99.0" text-anchor="end" dominant-baseline="central">Hugo</text><line class="axis" x1="213.8" x2="256.7" y1="99.0" y2="99.0"/><circle class="series-1 ring" cx="213.8" cy="99.0" r="6"/><circle class="series-2 ring" cx="256.7" cy="99.0" r="6"/><text class="value" x="268.7" y="99.0" dominant-baseline="central">2.8× from more cores</text><text class="label" x="180" y="129.0" text-anchor="end" dominant-baseline="central">Jigsaw</text><line class="axis" x1="279.2" x2="288.9" y1="129.0" y2="129.0"/><circle class="series-1 ring" cx="279.2" cy="129.0" r="6"/><circle class="series-2 ring" cx="288.9" cy="129.0" r="6"/><text class="value" x="300.9" y="129.0" dominant-baseline="central">1.1× from more cores</text><text class="label" x="180" y="159.0" text-anchor="end" dominant-baseline="central">Eleventy</text><line class="axis" x1="286.2" x2="307.4" y1="159.0" y2="159.0"/><circle class="series-1 ring" cx="286.2" cy="159.0" r="6"/><circle class="series-2 ring" cx="307.4" cy="159.0" r="6"/><text class="value" x="319.4" y="159.0" dominant-baseline="central">1.2× from more cores</text><text class="label" x="180" y="189.0" text-anchor="end" dominant-baseline="central">Sculpin</text><line class="axis" x1="384.9" x2="391.6" y1="189.0" y2="189.0"/><circle class="series-1 ring" cx="384.9" cy="189.0" r="6"/><circle class="series-2 ring" cx="391.6" cy="189.0" r="6"/><text class="value" x="403.6" y="189.0" dominant-baseline="central">1.0× from more cores</text><text class="label" x="180" y="219.0" text-anchor="end" dominant-baseline="central">Jekyll</text><line class="axis" x1="414.7" x2="427.4" y1="219.0" y2="219.0"/><circle class="series-1 ring" cx="414.7" cy="219.0" r="6"/><circle class="series-2 ring" cx="427.4" cy="219.0" r="6"/><text class="value" x="439.4" y="219.0" dominant-baseline="central">1.1× from more cores</text><text class="label" x="180" y="249.0" text-anchor="end" dominant-baseline="central">Hyde + fix</text><line class="axis" x1="514.0" x2="524.6" y1="249.0" y2="249.0"/><circle class="series-1 ring" cx="514.0" cy="249.0" r="6"/><circle class="series-2 ring" cx="524.6" cy="249.0" r="6"/><text class="value" x="536.6" y="249.0" dominant-baseline="central">1.0× from more cores</text></svg>
